# MorniCraft bauen; bei einer neuen Version auf main automatisch ein Release mit MorniCraft.jar und der Spawn-Insel.
#
# Verfasst mit Claude 🤖
name: Bauen

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Plugin bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Java 21 und Maven sind auf den GitHub-Rechnern schon da; gebaut wird für Java 17.
      - name: MorniCraft.jar bauen
        run: JAVA_HOME="$JAVA_HOME_21_X64" mvn -B -q package
      - name: Spawn-Insel packen
        run: cd datapack/MorniCraft-Spawn && zip -qr ../../target/MorniCraft-Spawn.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MorniCraft
          path: |
            target/MorniCraft.jar
            target/MorniCraft-Spawn.zip
          retention-days: 14
      - name: Release für eine neue Version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION gibt es schon – kein neues Release."
            exit 0
          fi
          NOTES="docs/releases/v$VERSION.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release create "v$VERSION" target/MorniCraft.jar target/MorniCraft-Spawn.zip \
            --title "MorniCraft $VERSION" --notes-file "$NOTES" --target "$GITHUB_SHA"
